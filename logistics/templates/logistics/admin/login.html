{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Logistics</title>
  <link href="{% static 'logistics/admin/vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">
  <link href="{% static 'logistics/admin/css/sb-admin-2.min.css' %}" rel="stylesheet">
</head>
<body class="bg-gradient-primary">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-xl-5 col-lg-6 col-md-8">
        <div class="card o-hidden border-0 shadow-lg my-5">
          <div class="card-body p-5">
            <h1 class="h4 text-gray-900 text-center mb-4">Logistics System</h1>
            {% if form.errors %}
              <div class="alert alert-danger">Invalid username or password.</div>
            {% endif %}
            <form method="post" class="user">
              {% csrf_token %}
              <input type="hidden" name="next" value="{{ next }}">
              <div class="form-group mb-3">
                <input type="text" name="username" class="form-control form-control-user"
                       placeholder="Username" required autofocus>
              </div>
              <div class="form-group mb-3">
                <input type="password" name="password" class="form-control form-control-user"
                       placeholder="Password" required>
              </div>
              <button type="submit" class="btn btn-primary btn-user btn-block w-100">Login</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
